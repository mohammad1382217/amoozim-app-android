# JVM args for the Gradle daemon. Raise -Xmx if you hit OOM on large builds.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Use AndroidX (required by Compose).
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only package the resources of the locales we ship (fa = Persian default).
android.nonTransitiveRClass=true

# Parallel + caching for faster incremental builds.
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache is disabled: it failed to serialize an AGP task
# (MapSourceSetPathsTask) on this AGP/Gradle combo. Re-enable once that's resolved.
# org.gradle.configuration-cache=true
